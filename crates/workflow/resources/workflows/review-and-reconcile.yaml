name: review-and-reconcile
description: Reviewers review in parallel, a worker distills their feedback into a decision-ready verdict, the reviewers respond to it, and the worker gives a final recommendation.
# Both prompts are hardcoded: `builtin:code-review` for the reviewers and
# `builtin:analyze-ai-reviews` for the worker's analysis. code-review's `context`
# argument is auto-derived from the prompt and offered as a user-fillable field;
# analyze-ai-reviews's required `review` argument is a computed binding (filled
# from the reviewers' aggregated responses) and never shown to the user.
#
# Labels name the *deliverable* each step produces (a noun phrase), not the
# dispatch; the `wait` labels are absorbed into the preceding send in the
# collapsed progress view.
inputs:
  reviewers:
    type: [agent]
    description: The agents that review in parallel, then respond to the worker's analysis.
  worker:
    type: agent
    description: The agent that distills the reviewers' feedback into a verdict, weighs their pushback, and gives the final recommendation.
steps:
  - label: Code review
    description: Each reviewer independently reviews the current changes in parallel.
    send:
      to: "{{ reviewers }}"
      prompt: "builtin:code-review"
  - label: Reviews received
    wait_for_all:
      agents: "{{ reviewers }}"
  - label: Verdict
    description: The worker distills the reviewers' feedback into a decision-ready verdict.
    send:
      to: "{{ worker }}"
      prompt: "builtin:analyze-ai-reviews"
      template_vars:
        review: "{{ aggregated_responses(reviewers) }}"
  - label: Verdict ready
    wait_for:
      agent: "{{ worker }}"
  - label: Reviewer responses
    description: The reviewers push back on or confirm the worker's verdict.
    send:
      to: "{{ reviewers }}"
      text: |
        An analyst reviewed all of the feedback and responded:

        {{ aggregated_responses(worker) }}

        Do you agree with this analysis? Push back where you think it's wrong, and confirm where it's right.
  - label: Responses received
    wait_for_all:
      agents: "{{ reviewers }}"
  - label: Final recommendation
    description: The worker weighs the reviewers' responses and gives a final recommendation.
    send:
      to: "{{ worker }}"
      text: |
        Here's how the reviewers responded to your analysis:

        {{ aggregated_responses(reviewers) }}

        Weigh their responses and settle every finding — where a reviewer changed your mind, say so plainly and name what changed it; where you stand firm, keep the refuting evidence.

        Then write ONE final response, addressed to the human who decides what happens next. They have read nothing else — not the reviews, not your analysis, not the responses — and this workflow does not send your reply back to the reviewers. Write for the human only, and do not reuse the per-finding template from your earlier analysis message.

        - Open with the bottom line, one or two sentences: the overall disposition in aggregate ("implementing N, rejecting M, one decision needed from you"), naming individually only what the human must act on. The bullets that follow carry the specifics — the opening is what they'd get if they stopped reading there.
        - Then one short group of bullets per issue that matters, in plain language and complete sentences. Never headline-fragment style ("Login flow: broken, not misconfigured") — write the sentence that explains it. Say what the issue is, what it means for the system or the user, and what you are doing about it. Depth scales with the weight of the issue, not with how much debate it generated or how much work it took.
        - A decision the human must make gets full detail: the question, the tradeoff in functional terms, your recommendation and why, and what happens if they defer. This is the one place length is never the constraint.
        - Within an issue, if the fix you're adopting adds machinery, new behavior, a new threshold, or a new failure path beyond the original change, say so in the bullet and name the cost. A fix that increases complexity is a tradeoff the human is accepting, not a free win.
        - Minor uncontested items — cleanup, doc fixes, small test additions — get one full sentence each, or one shared sentence for the lot.
        - Name a file, function, or test only where the reader needs it to act or a later session would need it to implement, folded into the bullet as a clause rather than a separate section.
        - Refer to nothing by finding number or debate-internal label; restate what each thing is.
        - Close with a net-effect assessment, a few plain sentences answering three questions: Did the review change your assessment of the original change — and if so, which finding did it? Do the accepted fixes make the change meaningfully larger or riskier than what was reviewed, and where does the new risk live? After everything lands, what is the single riskiest thing that remains? Never a bare severity label — every risk claim carries its reason in the same sentence.
  - label: Recommendation ready
    wait_for:
      agent: "{{ worker }}"
