name: hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust lint + test (macos-15)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The rustup shim reads `rust-toolchain.toml`, which remains the single
      # source for the toolchain version, profile, and components.
      - name: Resolve pinned Rust toolchain
        run: rustc --version --verbose

      # Keep manifests in rust-cache's fallback-able key suffix so dependency
      # changes can reuse prior artifacts. Pin the action because its key
      # derivation determines whether otherwise valid caches remain reachable.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check

      - name: make check-rust
        run: make check-rust

  frontend:
    name: Frontend lint + test (macos-15)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Keep in sync with `packageManager` in package.json.
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The browser test suite drives Playwright's WebKit build (~100MB). Cache
      # it on the macOS path (runner is macos-15) so it downloads once instead
      # of every push; `make check-frontend` reinstalls idempotently on a miss.
      # restore-keys lets an unrelated lockfile bump reuse the prior browser
      # when the resolved Playwright version is unchanged.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: make check-frontend
        run: make check-frontend
