[package]
name = "switchboard-remote-crypto"
description = "Switchboard remote-access cryptography, shared with the iOS app through UniFFI (pure Rust, no tokio, no Tauri)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Builds the `uniffi-bindgen` binary that `make ios-crypto` runs to generate the
# Swift bindings. Off by default so the library never pulls in the CLI.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
sha2 = "0.11.0"
thiserror.workspace = true
uniffi = "0.32.2"
