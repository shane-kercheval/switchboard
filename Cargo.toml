[workspace]
resolver = "2"
members = ["crates/*", "desktop/src-tauri"]
# `crates/app` is a retired path: the Tauri crate moved to `desktop/src-tauri`.
# A checkout from before the move can keep its gitignored `crates/app/gen/`
# after pulling, and the `crates/*` glob would then fail every cargo command on
# a member with no manifest. Don't reuse the name.
exclude = ["crates/app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Shane Kercheval <shane.kercheval@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/shane-kercheval/switchboard"
rust-version = "1.95"

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "8"
async-trait = "0.1"
futures = "0.3"
tempfile = "3"
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "1.1.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we don't want — they trigger on common, readable patterns.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Dependencies compile without debug info; our own crates keep theirs.
#
# Debug symbols for third-party code are the single largest contributor to
# `target/` growth, and they buy nothing here — stepping into Tauri or tokio
# internals is not part of any workflow this project has. Dropping them cuts
# build-directory size roughly in half and speeds up linking, which is the
# slowest phase of the Tauri crate's build. Delete this block if you ever
# genuinely need to debug into a dependency; it costs one full rebuild each
# way, because changing a profile invalidates every artifact built under it.
[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The iOS static library from `crates/remote-crypto` (`make ios-crypto`). UniFFI
# turns a Rust panic into a Swift error only by unwinding it, so under the
# desktop's `panic = "abort"` a panic in code reading relay bytes would kill
# the app rather than fail the one frame.
[profile.ios]
inherits = "release"
panic = "unwind"
