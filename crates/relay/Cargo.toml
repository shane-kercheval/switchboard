[package]
name = "switchboard-relay"
description = "Switchboard's remote-access relay: forwards encrypted frames between a Mac and its phones"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
chrono.workspace = true
data-encoding.workspace = true
futures.workspace = true
getrandom.workspace = true
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
switchboard-remote-crypto = { path = "../remote-crypto" }
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.29.0"

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6.5", features = ["all"] }
